.about-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

/* All About Sections */

.about-section {
    background: #ffffff;
    margin-bottom: 30px;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.about-section h2 {
    color: #003366;
    margin-bottom: 18px;
    border-bottom: 3px solid #003366;
    display: inline-block;
    padding-bottom: 5px;
}

.about-section p {
    font-size: 17px;
    line-height: 1.8;
    text-align: justify;
    color: #444;
}

/* Career Journey */

.career-journey {
    border-left: 6px solid #003366;
    background: #f8fbff;
}

.career-journey strong {
    color: #003366;
}

/* Education */

.education-item {
    background: #f5f7fa;
    padding: 20px;
    margin-top: 20px;
    border-radius: 8px;
    border-left: 5px solid #003366;
}

.education-item h3 {
    margin-top: 0;
    color: #003366;
}

.education-item p {
    margin: 8px 0;
}

/* Skills */

.skills-list,
.focus-list {
    list-style: none;
    padding: 0;
}

.skills-list li,
.focus-list li {
    background: #eef4fb;
    margin-bottom: 12px;
    padding: 15px;
    border-left: 5px solid #003366;
    border-radius: 6px;
    font-weight: 500;
}

/* Highlight Box */

.highlight-box {
    background: #003366;
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 25px;
    text-align: center;
}

.highlight-box h3 {
    margin-top: 0;
}

.highlight-box p {
    color: white;
}

/* Responsive */

@media (max-width:768px){

.about-container{
padding:15px;
}

.about-section{
padding:20px;
}

.about-section p{
font-size:16px;
